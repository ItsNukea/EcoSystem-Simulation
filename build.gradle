plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'es.sim'
version = '1.0'
def uuid = "3aba9791-36f3-4970-aa05-5fe051df6c31"       //Windows upgrade uuid DO NOT CHANGE

application {
    mainClass = "es.sim.Main"
}

repositories {
    mavenCentral()
    maven { url "https://jitpack.io" }
}

dependencies {
    implementation "ch.qos.logback:logback-classic:1.6.3"       //Logging library
    implementation 'tools.jackson.core:jackson-databind:3.2.4'  //JSON (de)serialization library
    implementation "org.jetbrains:annotations:26.1.0"           //for handy @Annotations like @Nullable
    //DOES NOT WORK WITH MULTI-THREADING
    //implementation "com.github.xaguzman:pathfinding:0.2.6"      //Pathfinding algorithms. Documentation at https://github.com/xaguzman/pathfinding
    implementation 'com.github.ItsNukea:pathfinding:9b3464b6bd'
    implementation "com.github.czyzby:noise4j:0.1.0"            //Noise map generation. Documentation at https://github.com/czyzby/noise4j
    implementation "org.jfree:jfreechart:1.5.6"                 //Chart generation.
}

shadowJar {
    archiveBaseName.set("ecosystem-simulator-fat")
    archiveClassifier.set("")
}

tasks.register('jpackage', Exec) {
    dependsOn 'shadowJar'

    File libDir = layout.buildDirectory.dir("libs").get().asFile
    commandLine 'jpackage',
            '--input', libDir,
            '--name', 'Ecosystem Simulator',
            '--icon', "src/main/resources/textures/ess/appicon.ico",
            '--main-jar', "ecosystem-simulator-fat-${version}.jar",
            '--main-class', 'es.sim.Main',
            '--type', 'exe',
            '--app-version', version,
            '--vendor', 'Keanu en Louis',
            '--win-shortcut-prompt',
            '--win-upgrade-uuid', uuid,
            '--win-menu'

    doLast {
        def original = file("Ecosystem Simulator-${version}.exe")
        def renamed = file("ecosystem-simulator-${version}.exe")

        if (renamed.exists()) {
            renamed.delete()
        }
        original.renameTo(renamed)
    }
}